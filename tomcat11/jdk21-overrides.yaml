schema_version: 1

name: "jboss-webserver-7/jws70-openjdk21-rhel9-openshift"
description: "Red Hat JBoss Web Server 7.0 - Tomcat 11 OpenShift container image with OpenJDK21 on UBI9"
version: "7.0.1"
from: "jboss-webserver-7-webserver70-openjdk21-tomcat11-rhel9:7.0.1"
labels:
    - name: "com.redhat.component"
      value: "jboss-webserver-70-openjdk21-rhel9-openshift-container"
    - name: "io.k8s.description"
      value: "Platform for building and running web applications on JBoss Web Server 7.0 with OpenJDK21 - Tomcat v11"
modules:
      repositories:
          - name: cct_module
            git:
                  url: https://github.com/jboss-openshift/cct_module.git
                  ref: 0.45.6
          - name: jboss-eap-modules
            git:
                  url: https://github.com/jboss-container-images/jboss-eap-modules.git
                  ref: master
          - name: jboss-jws-modules
            git:
                  url: https://github.com/web-servers/jboss-jws-container-images-modules
                  ref: main
          - path: custom-modules
      install:
          - name: jboss.container.maven
            version: "3.9.21"

osbs:
      repository:
            name: containers/jboss-webserver-openjdk21-tomcat11
            branch: jws-7.0-openshift-dev-rhel-9
